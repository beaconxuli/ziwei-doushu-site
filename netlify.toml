# Netlify 配置（紫微斗数站）
#
# Next.js（App Router + API 路由）走 Netlify 的 Next.js 运行时：
# 由 @netlify/plugin-nextjs 把 SSR 页面与 /api/* 转成 Netlify Functions。
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 说明：/api/interpret 与 /api/heming 是 SSE 流式接口，
# Next.js 运行时会把它们转成 Netlify Functions，SSE 直接透传。
